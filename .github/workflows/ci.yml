name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - staging

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Desktop lint has older warnings to clean up (see docs/codebase-review.md); add it back when it passes.
      - name: Lint
        run: pnpm turbo run lint --filter='!@blackbox/desktop'

      - name: Test
        run: pnpm test
