appId: com.blackbox.desktop
productName: Blackbox
executableName: blackbox
# THIS LINE FIXES THE ISSUE by overriding the file name to avoid slashes
artifactName: ${executableName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
mac:
  target:
    - dmg
  category: public.app-category.productivity
win:
  target:
    - nsis
linux:
  category: Office
  target:
    - AppImage
    - deb
deb:
  packageName: blackbox
